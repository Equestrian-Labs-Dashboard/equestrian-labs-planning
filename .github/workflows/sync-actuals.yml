name: Sync Actuals and Deploy to Cloudflare Pages
on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * 1'

permissions:
  contents: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check Cloudflare deploy secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Missing Cloudflare secret::Add repository secret CLOUDFLARE_API_TOKEN before running this workflow."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Missing Cloudflare secret::Add repository secret CLOUDFLARE_ACCOUNT_ID before running this workflow."
            exit 1
          fi

      - name: Sync Shopify actuals
        env:
          SHOPIFY_CORRO_STORE: ${{ secrets.SHOPIFY_CORRO_STORE }}
          SHOPIFY_CORRO_TOKEN: ${{ secrets.SHOPIFY_CORRO_TOKEN }}
          SHOPIFY_CAVALI_STORE: ${{ secrets.SHOPIFY_CAVALI_STORE }}
          SHOPIFY_CAVALI_TOKEN: ${{ secrets.SHOPIFY_CAVALI_TOKEN }}
        run: node scripts/sync-shopify-actuals.mjs

      - name: Sync Cavali Smartrr actuals
        continue-on-error: true
        env:
          SMARTRR_API_KEY_CAVALI: ${{ secrets.SMARTRR_API_KEY_CAVALI }}
        run: node scripts/sync-smartrr-cavali.mjs

      - name: Sync connected Google Sheets actuals
        continue-on-error: true
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ADS_SHEET_ID: ${{ secrets.ADS_SHEET_ID }}
          SHEET_ID_CORRO: ${{ secrets.SHEET_ID_CORRO }}
          SHEET_ID_CAVALI: ${{ secrets.SHEET_ID_CAVALI }}
        run: node scripts/sync-connected-data.mjs

      - name: Validate JavaScript
        run: |
          node --check assets/js/dataService.js
          node --check assets/js/app.js
          node --check scripts/sync-smartrr-cavali.mjs
          npm test

      - name: Commit refreshed data
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data/shopify_actuals.json data/connected_actuals.json data/cavali_smartrr_actuals.json
          git diff --cached --quiet || git commit -m "Refresh strategic model actuals"
          git push || true

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy . --project-name=strategic-operating-model --branch=main
