name: Sync Actuals and Deploy to GitHub Pages
on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * 1'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  sync:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sync Shopify actuals
        env:
          SHOPIFY_CORRO_STORE: ${{ secrets.SHOPIFY_CORRO_STORE }}
          SHOPIFY_CORRO_TOKEN: ${{ secrets.SHOPIFY_CORRO_TOKEN }}
          SHOPIFY_CAVALI_STORE: ${{ secrets.SHOPIFY_CAVALI_STORE }}
          SHOPIFY_CAVALI_TOKEN: ${{ secrets.SHOPIFY_CAVALI_TOKEN }}
        run: node scripts/sync-shopify-actuals.mjs
      - name: Validate Shopify actuals generated
        run: |
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('data/shopify_actuals.json','utf8'));const b=d.brands||{};if(!d.generated_at||!b.corro||!b.cavali)throw new Error('Shopify actuals were not generated for both Corro and Cavali; deployment stopped to protect the dashboard.');console.log('Validated Shopify actuals:',d.generated_at,'Corro orders:',b.corro.orderCount,'Cavali orders:',b.cavali.orderCount)"
      - name: Sync Cavali Smartrr actuals
        continue-on-error: true
        env:
          SMARTRR_API_KEY_CAVALI: ${{ secrets.SMARTRR_API_KEY_CAVALI }}
        run: node scripts/sync-smartrr-cavali.mjs
      - name: Sync connected Google Sheets actuals
        continue-on-error: true
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ADS_SHEET_ID: ${{ secrets.ADS_SHEET_ID }}
          SHEET_ID_CORRO: ${{ secrets.SHEET_ID_CORRO }}
          SHEET_ID_CAVALI: ${{ secrets.SHEET_ID_CAVALI }}
        run: node scripts/sync-connected-data.mjs
      - name: Validate JavaScript
        run: npm run check
      - name: Commit refreshed data
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data/shopify_actuals.json data/connected_actuals.json data/cavali_smartrr_actuals.json
          git diff --cached --quiet || git commit -m "Refresh strategic model actuals"
          git push || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
